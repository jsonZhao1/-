name: Build Linux AppImage

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Check admin window behavior
        run: node build/test-admin-window.js

      - name: Clean up mirror cache
        run: |
          rm -f package-lock.json
          rm -f yarn.lock
          rm -f .npmrc
          npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install --legacy-peer-deps --loglevel verbose

      - name: Prepare bundled offline Chinese speech
        run: bash build/prepare-tts.sh

      - name: Build Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build -- --linux AppImage deb --x64

      - name: Test packaged voice offline on glibc 2.31
        run: |
          docker pull node:16-bullseye
          docker run --rm --network none -v "$PWD:/work" -w /work node:16-bullseye node build/smoke-tts.js electron-builder-output-dir/linux-unpacked/resources/tts

      - name: Upload speech sample
        uses: actions/upload-artifact@v4
        with:
          name: offline-speech-sample
          path: tts-smoke-output/*.wav
          if-no-files-found: error

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            electron-builder-output-dir/*.AppImage
            electron-builder-output-dir/*.deb
